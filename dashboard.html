
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BKMI-Sweetbeauty Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;font-family:Arial,sans-serif;background:#f8f5fa;color:#29212f}
header{background:#54206f;color:white;padding:22px;border-radius:12px;margin-bottom:20px}
header h1{margin:0 0 8px;font-size:23px}
header p{margin:0}
.section{background:white;padding:18px;border-radius:12px;margin-bottom:22px;box-shadow:0 2px 10px #0000000d}
h2{color:#54206f;margin-top:0}
label{display:block;margin-top:12px;font-weight:bold;font-size:14px}
input,textarea,select{width:100%;padding:12px;margin-top:6px;border:1px solid #d8cddd;border-radius:7px;font-size:15px}
textarea{min-height:85px}
button{padding:11px 15px;border:0;border-radius:7px;background:#54206f;color:white;font-weight:bold;cursor:pointer;margin:5px 4px 5px 0}
button.secondary{background:#777}
button.danger{background:#b52d45}
button.success{background:#25834d}
button.warning{background:#a66a12}
button:disabled{opacity:.5}
.card{border:1px solid #e5dce9;padding:14px;border-radius:9px;margin:12px 0;overflow-wrap:anywhere}
.card h3{color:#54206f;margin:0 0 10px}
.small{font-size:13px;color:#665b6b}
.status{font-weight:bold;text-transform:capitalize}
.hidden{display:none}
.actions{margin-top:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.notice{padding:12px;background:#f1e8f6;border-radius:8px;margin:10px 0}
@media(max-width:600px){.grid{grid-template-columns:1fr}body{padding:10px}}
</style>
</head>

<body>

<header>
<h1>BKMI-Sweetbeauty</h1>
<p>Admin Management Dashboard</p>
</header>

<div class="section">
<button onclick="showSection('applications')">Applications</button>
<button onclick="showSection('courses')">Manage Courses</button>
<button class="secondary" onclick="logout()">Log Out</button>
<p id="message" class="small">Checking administrator access...</p>
</div>

<div id="applicationsSection" class="section">
<h2>Student Applications</h2>
<button onclick="loadApplications()">Refresh Applications</button>
<div id="applicationsList">Loading applications...</div>
</div>

<div id="coursesSection" class="section hidden">
<h2>Course Management</h2>

<div class="notice">
Manage course names, descriptions, durations, regular fees, early-bird fees and active status here.
</div>

<h3 id="courseFormTitle">Add New Course</h3>

<form id="courseForm">
<input type="hidden" id="courseId">

<label>Course Name</label>
<input id="courseName" required placeholder="Enter course name">

<label>Course Description</label>
<textarea id="courseDescription" placeholder="Enter course description"></textarea>

<div class="grid">
<div>
<label>Duration</label>
<input id="courseDuration" required placeholder="e.g. 2 months">
</div>
<div>
<label>Regular Fee (₦)</label>
<input id="courseFee" type="number" min="0" required>
</div>
</div>

<div class="grid">
<div>
<label>Early-Bird Fee (₦)</label>
<input id="earlyBirdFee" type="number" min="0">
</div>
<div>
<label>Course Flyer URL</label>
<input id="flyerUrl" type="url" placeholder="https://...">
</div>
</div>

<label>Course Status</label>
<select id="courseActive">
<option value="true">Active - Publicly Visible</option>
<option value="false">Inactive - Hidden</option>
</select>

<div class="actions">
<button type="submit" id="saveCourseButton">Save Course</button>
<button type="button" class="secondary" onclick="resetCourseForm()">Clear Form</button>
</div>
</form>

<hr>

<h3>Existing Courses</h3>
<button onclick="loadCourses()">Refresh Courses</button>
<div id="coursesList">Loading courses...</div>
</div>

<script>
const SUPABASE_URL = "https://ahercmxxwwbeobywyudv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_L0hGKk2ACWTVsTFrsfCvMQ_kK-nHXa1";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;

function message(text) {
  document.getElementById("message").textContent = text;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[char];
  });
}

function showSection(section) {
  document.getElementById("applicationsSection").classList.toggle("hidden", section !== "applications");
  document.getElementById("coursesSection").classList.toggle("hidden", section !== "courses");

  if (section === "courses") loadCourses();
  if (section === "applications") loadApplications();
}

async function checkAdmin() {
  const { data: { session }, error } = await db.auth.getSession();

  if (error || !session) {
    window.location.href = "admin.html";
    return;
  }

  currentUser = session.user;

  const { data, error: roleError } = await db
    .from("AdminUsers")
    .select("role")
    .eq("user_id", currentUser.id)
    .maybeSingle();

  if (roleError || !data || data.role !== "admin") {
    message("Administrator access could not be verified.");
    await db.auth.signOut();
    window.location.href = "admin.html";
    return;
  }

  message("Logged in as administrator.");
  loadApplications();
}

async function logout() {
  await db.auth.signOut();
  window.location.href = "admin.html";
}

/* APPLICATION MANAGEMENT */

async function loadApplications() {
  const container = document.getElementById("applicationsList");
  container.textContent = "Loading applications...";

  const { data, error } = await db
    .from("Applications")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    container.textContent = "Could not load applications: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    container.textContent = "No applications found.";
    return;
  }

  container.innerHTML = data.map(app => `
    <div class="card">
      <h3>${escapeHTML(app["Full Name"])}</h3>
      <p><b>Email:</b> ${escapeHTML(app.Email || "Not provided")}</p>
      <p><b>Phone:</b> ${escapeHTML(app["Phone Number"] || "Not provided")}</p>
      <p><b>Course:</b> ${escapeHTML(app.Course || "Not specified")}</p>
      <p><b>Message:</b> ${escapeHTML(app.Message || "None")}</p>
      <p><b>Status:</b> <span class="status">${escapeHTML(app["Application Status"] || "pending")}</span></p>
      <p class="small">Submitted: ${escapeHTML(app.created_at || "")}</p>
      <div class="actions">
        <button class="success" onclick="updateApplication(${Number(app.id)},'approved')">Approve</button>
        <button class="warning" onclick="updateApplication(${Number(app.id)},'rejected')">Reject</button>
        <button class="danger" onclick="deleteApplication(${Number(app.id)})">Delete</button>
      </div>
    </div>
  `).join("");
}

async function updateApplication(id, status) {
  const { error } = await db
    .from("Applications")
    .update({ "Application Status": status })
    .eq("id", id);

  if (error) {
    alert("Update failed: " + error.message);
    return;
  }

  alert("Application status updated.");
  loadApplications();
}

async function deleteApplication(id) {
  if (!confirm("Are you sure you want to delete this application?")) return;

  const { error } = await db
    .from("Applications")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Delete failed: " + error.message);
    return;
  }

  alert("Application deleted.");
  loadApplications();
}

/* COURSE MANAGEMENT */

async function loadCourses() {
  const container = document.getElementById("coursesList");
  container.textContent = "Loading courses...";

  const { data, error } = await db
    .from("Courses")
    .select("*")
    .order("Course_Name", { ascending: true });

  if (error) {
    container.textContent = "Could not load courses: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    container.textContent = "No courses found.";
    return;
  }

  container.innerHTML = data.map(course => `
    <div class="card">
      <h3>${escapeHTML(course.Course_Name)}</h3>
      <p>${escapeHTML(course.Description || "No description")}</p>
      <p><b>Duration:</b> ${escapeHTML(course.Duration)}</p>
      <p><b>Regular Fee:</b> ₦${Number(course.Course_fee || 0).toLocaleString("en-NG")}</p>
      <p><b>Early-Bird Fee:</b> ₦${Number(course.Early_Bird_Fee || 0).toLocaleString("en-NG")}</p>
      <p><b>Status:</b> ${course.Is_active ? "Active" : "Inactive"}</p>
      <div class="actions">
        <button onclick="editCourse('${escapeHTML(course.id)}')">Edit</button>
        <button class="warning" onclick="toggleCourse('${escapeHTML(course.id)}',${!course.Is_active})">
          ${course.Is_active ? "Deactivate" : "Activate"}
        </button>
        <button class="danger" onclick="deleteCourse('${escapeHTML(course.id)}')">Delete</button>
      </div>
    </div>
  `).join("");
}

async function editCourse(id) {
  const { data, error } = await db
    .from("Courses")
    .select("*")
    .eq("id", id)
    .single();

  if (error) {
    alert("Could not open course: " + error.message);
    return;
  }

  document.getElementById("courseId").value = data.id;
  document.getElementById("courseName").value = data.Course_Name || "";
  document.getElementById("courseDescription").value = data.Description || "";
  document.getElementById("courseDuration").value = data.Duration || "";
  document.getElementById("courseFee").value = data.Course_fee ?? "";
  document.getElementById("earlyBirdFee").value = data.Early_Bird_Fee ?? "";
  document.getElementById("flyerUrl").value = data.Course_Flyer_URL || "";
  document.getElementById("courseActive").value = String(data.Is_active);

  document.getElementById("courseFormTitle").textContent = "Edit Course";
  document.getElementById("saveCourseButton").textContent = "Update Course";

  document.getElementById("courseForm").scrollIntoView({ behavior: "smooth" });
}

function resetCourseForm() {
  document.getElementById("courseForm").reset();
  document.getElementById("courseId").value = "";
  document.getElementById("courseFormTitle").textContent = "Add New Course";
  document.getElementById("saveCourseButton").textContent = "Save Course";
}

document.getElementById("courseForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const id = document.getElementById("courseId").value;

  const course = {
    Course_Name: document.getElementById("courseName").value.trim(),
    Description: document.getElementById("courseDescription").value.trim(),
    Duration: document.getElementById("courseDuration").value.trim(),
    Course_fee: Number(document.getElementById("courseFee").value),
    Early_Bird_Fee: document.getElementById("earlyBirdFee").value === ""
      ? null
      : Number(document.getElementById("earlyBirdFee").value),
    Course_Flyer_URL: document.getElementById("flyerUrl").value.trim() || null,
    Is_active: document.getElementById("courseActive").value === "true"
  };

  const button = document.getElementById("saveCourseButton");
  button.disabled = true;

  let result;

  if (id) {
    result = await db
      .from("Courses")
      .update(course)
      .eq("id", id);
  } else {
    result = await db
      .from("Courses")
      .insert([course]);
  }

  button.disabled = false;

  if (result.error) {
    alert("Could not save course: " + result.error.message);
    return;
  }

  alert(id ? "Course updated successfully." : "Course added successfully.");
  resetCourseForm();
  loadCourses();
});

async function toggleCourse(id, active) {
  const { error } = await db
    .from("Courses")
    .update({ Is_active: active })
    .eq("id", id);

  if (error) {
    alert("Could not change course status: " + error.message);
    return;
  }

  loadCourses();
}

async function deleteCourse(id) {
  if (!confirm("Are you sure you want to permanently delete this course?")) return;

  const { error } = await db
    .from("Courses")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Could not delete course: " + error.message);
    return;
  }

  alert("Course deleted.");
  loadCourses();
}

checkAdmin();
</script>

</body>
</html>
