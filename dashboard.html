
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#54206f">
<title>BKMI-Sweetbeauty Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f7f3fa;
  color: #302438;
}

header {
  background: #54206f;
  color: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}

h1 { margin-top: 0; }

section, .card {
  background: white;
  padding: 18px;
  margin-bottom: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #00000010;
}

input, textarea, select {
  display: block;
  width: 100%;
  padding: 12px;
  margin: 8px 0 15px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 15px;
}

button {
  padding: 11px 16px;
  border: none;
  border-radius: 7px;
  background: #54206f;
  color: white;
  cursor: pointer;
  margin: 4px;
  font-size: 14px;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.warning { background: #b87916; }
.danger { background: #b52b36; }
.edit { background: #2874a6; }

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.small {
  color: #777;
  font-size: 13px;
}

.hidden { display: none; }

.status {
  padding: 10px;
  background: #f1e8f6;
  border-radius: 7px;
  margin: 10px 0;
}

</style>
</head>

<body>

<header>
  <h1>BKMI-Sweetbeauty</h1>
  <p>Admin Dashboard</p>
  <button id="logoutButton">Log Out</button>
</header>

<div id="message" class="status">Checking administrator access...</div>

<main id="dashboardContent" class="hidden">

<section>
  <h2>Applications</h2>
  <div id="applicationsList">Loading applications...</div>
</section>

<section>
  <h2 id="courseFormTitle">Add New Course</h2>

  <form id="courseForm">
    <input type="hidden" id="courseId">
    <input type="hidden" id="flyerUrl">

    <label>Course Name</label>
    <input id="courseName" required>

    <label>Course Description</label>
    <textarea id="courseDescription" rows="4"></textarea>

    <label>Course Duration</label>
    <input id="courseDuration" required>

    <label>Regular Course Fee (₦)</label>
    <input id="courseFee" type="number" min="0" required>

    <label>Early-Bird Fee (₦)</label>
    <input id="earlyBirdFee" type="number" min="0">

    <label>Upload Course Flyer</label>
    <input id="flyerFile" type="file" accept="image/jpeg,image/png,image/webp">
    <p class="small">Choose a JPG, PNG or WebP image. Maximum 5MB.</p>

    <label>Course Status</label>
    <select id="courseActive">
      <option value="true">Active</option>
      <option value="false">Inactive</option>
    </select>

    <button type="submit" id="saveCourseButton">Save Course</button>
    <button type="button" id="cancelEditButton" class="warning">Clear Form</button>
  </form>
</section>

<section>
  <h2>Manage Courses</h2>
  <div id="coursesList">Loading courses...</div>
</section>

</main>

<script>
const SUPABASE_URL = "https://ahercmxxwwbeobywyudv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_L0hGKk2ACWTVsTFrsfCvMQ_kK-nHXa1";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const message = document.getElementById("message");
const dashboardContent = document.getElementById("dashboardContent");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[character]);
}

async function checkAdmin() {
  const { data: { session }, error } = await db.auth.getSession();

  if (error || !session) {
    window.location.href = "admin.html";
    return;
  }

  const { data: admin, error: adminError } = await db
    .from("AdminUsers")
    .select("role")
    .eq("user_id", session.user.id)
    .single();

  if (adminError || !admin || admin.role !== "admin") {
    message.textContent = "Access denied. Administrator account required.";
    await db.auth.signOut();
    window.location.href = "admin.html";
    return;
  }

  message.textContent = "Administrator access verified.";
  dashboardContent.classList.remove("hidden");

  await loadApplications();
  await loadCourses();
}

document.getElementById("logoutButton").addEventListener("click", async () => {
  await db.auth.signOut();
  window.location.href = "admin.html";
});

async function loadApplications() {
  const container = document.getElementById("applicationsList");
  container.textContent = "Loading applications...";

  const { data, error } = await db
    .from("Applications")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    container.textContent = "Could not load applications: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    container.textContent = "No applications found.";
    return;
  }

  container.innerHTML = data.map(app => `
    <div class="card">
      <h3>${escapeHTML(app.Full_Name || app.full_name || "Applicant")}</h3>
      <p>Phone: ${escapeHTML(app.Phone_Number || app.phone || "")}</p>
      <p>Email: ${escapeHTML(app.Email || app.email || "")}</p>
      <p>Course: ${escapeHTML(app.Course || app.course || "")}</p>
      <p>Status: ${escapeHTML(app.Status || app.status || "Pending")}</p>
      <div class="actions">
        <button class="application-action" data-id="${escapeHTML(app.id)}" data-status="Approved">Approve</button>
        <button class="warning application-action" data-id="${escapeHTML(app.id)}" data-status="Rejected">Reject</button>
        <button class="danger application-delete" data-id="${escapeHTML(app.id)}">Delete</button>
      </div>
    </div>
  `).join("");

  container.querySelectorAll(".application-action").forEach(button => {
    button.addEventListener("click", () =>
      updateApplication(button.dataset.id, button.dataset.status)
    );
  });

  container.querySelectorAll(".application-delete").forEach(button => {
    button.addEventListener("click", () =>
      deleteApplication(button.dataset.id)
    );
  });
}

async function updateApplication(id, status) {
  const { error } = await db
    .from("Applications")
    .update({ Status: status })
    .eq("id", id);

  if (error) {
    alert("Could not update application: " + error.message);
    return;
  }

  alert("Application updated.");
  await loadApplications();
}

async function deleteApplication(id) {
  if (!confirm("Delete this application permanently?")) return;

  const { error } = await db
    .from("Applications")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Could not delete application: " + error.message);
    return;
  }

  await loadApplications();
}

async function loadCourses() {
  const container = document.getElementById("coursesList");
  container.textContent = "Loading courses...";

  const { data, error } = await db
    .from("Courses")
    .select("*")
    .order("Course_Name", { ascending: true });

  if (error) {
    container.textContent = "Could not load courses: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    container.textContent = "No courses found.";
    return;
  }

  container.innerHTML = data.map(course => `
    <div class="card">
      <h3>${escapeHTML(course.Course_Name)}</h3>
      <p>${escapeHTML(course.Description || "No description")}</p>
      <p><b>Duration:</b> ${escapeHTML(course.Duration)}</p>
      <p><b>Regular Fee:</b> ₦${Number(course.Course_fee || 0).toLocaleString("en-NG")}</p>
      <p><b>Early-Bird Fee:</b> ₦${Number(course.Early_Bird_Fee || 0).toLocaleString("en-NG")}</p>
      <p><b>Status:</b> ${course.Is_active ? "Active" : "Inactive"}</p>
      ${course.Course_Flyer_URL ? `<p><a href="${escapeHTML(course.Course_Flyer_URL)}" target="_blank" rel="noopener">View Flyer</a></p>` : ""}
      <div class="actions">
        <button type="button" class="edit edit-course-btn" data-course-id="${escapeHTML(course.id)}">Edit</button>
        <button type="button" class="warning toggle-course-btn" data-course-id="${escapeHTML(course.id)}" data-active="${!course.Is_active}">
          ${course.Is_active ? "Deactivate" : "Activate"}
        </button>
        <button type="button" class="danger delete-course-btn" data-course-id="${escapeHTML(course.id)}">Delete</button>
      </div>
    </div>
  `).join("");

  container.querySelectorAll(".edit-course-btn").forEach(button => {
    button.addEventListener("click", () => editCourse(button.dataset.courseId));
  });

  container.querySelectorAll(".toggle-course-btn").forEach(button => {
    button.addEventListener("click", () =>
      toggleCourse(button.dataset.courseId, button.dataset.active === "true")
    );
  });

  container.querySelectorAll(".delete-course-btn").forEach(button => {
    button.addEventListener("click", () => deleteCourse(button.dataset.courseId));
  });
}

async function editCourse(id) {
  const { data, error } = await db
    .from("Courses")
    .select("*")
    .eq("id", id)
    .single();

  if (error) {
    alert("Could not open course: " + error.message);
    return;
  }

  document.getElementById("courseId").value = data.id;
  document.getElementById("courseName").value = data.Course_Name || "";
  document.getElementById("courseDescription").value = data.Description || "";
  document.getElementById("courseDuration").value = data.Duration || "";
  document.getElementById("courseFee").value = data.Course_fee ?? "";
  document.getElementById("earlyBirdFee").value = data.Early_Bird_Fee ?? "";
  document.getElementById("flyerUrl").value = data.Course_Flyer_URL || "";
  document.getElementById("courseActive").value = String(data.Is_active);

  document.getElementById("courseFormTitle").textContent = "Edit Course";
  document.getElementById("saveCourseButton").textContent = "Update Course";

  document.getElementById("courseForm").scrollIntoView({ behavior: "smooth" });
}

async function toggleCourse(id, active) {
  const { error } = await db
    .from("Courses")
    .update({ Is_active: active })
    .eq("id", id);

  if (error) {
    alert("Could not change course status: " + error.message);
    return;
  }

  await loadCourses();
}

async function deleteCourse(id) {
  if (!confirm("Are you sure you want to permanently delete this course?")) return;

  const { error } = await db
    .from("Courses")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Could not delete course: " + error.message);
    return;
  }

  alert("Course deleted.");
  await loadCourses();
}

function resetCourseForm() {
  document.getElementById("courseForm").reset();
  document.getElementById("courseId").value = "";
  document.getElementById("flyerUrl").value = "";
  document.getElementById("courseFormTitle").textContent = "Add New Course";
  document.getElementById("saveCourseButton").textContent = "Save Course";
}

document.getElementById("cancelEditButton").addEventListener("click", resetCourseForm);

document.getElementById("courseForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const button = document.getElementById("saveCourseButton");
  button.disabled = true;

  try {
    const id = document.getElementById("courseId").value;
    const flyerFile = document.getElementById("flyerFile").files[0];

    let flyerUrl = document.getElementById("flyerUrl").value.trim() || null;

    if (flyerFile) {
      if (flyerFile.size > 5 * 1024 * 1024) {
        alert("Flyer image must not exceed 5MB.");
        return;
      }

      const fileName = Date.now() + "-" +
        flyerFile.name.replace(/[^a-zA-Z0-9._-]/g, "-");

      const { data: uploadData, error: uploadError } = await db
        .storage
        .from("course-flyers")
        .upload(fileName, flyerFile);

      if (uploadError) {
        alert("Flyer upload failed: " + uploadError.message);
        return;
      }

      const { data: publicData } = db
        .storage
        .from("course-flyers")
        .getPublicUrl(uploadData.path);

      flyerUrl = publicData.publicUrl;
    }

    const course = {
      Course_Name: document.getElementById("courseName").value.trim(),
      Description: document.getElementById("courseDescription").value.trim(),
      Duration: document.getElementById("courseDuration").value.trim(),
      Course_fee: Number(document.getElementById("courseFee").value),
      Early_Bird_Fee: document.getElementById("earlyBirdFee").value === ""
        ? null
        : Number(document.getElementById("earlyBirdFee").value),
      Course_Flyer_URL: flyerUrl,
      Is_active: document.getElementById("courseActive").value === "true"
    };

    let result;

    if (id) {
      result = await db
        .from("Courses")
        .update(course)
        .eq("id", id)
        .select();
    } else {
      result = await db
        .from("Courses")
        .insert([course]);
    }

    if (result.error) {
      alert("Could not save course: " + result.error.message);
      return;
    }

    if (id && (!result.data || result.data.length === 0)) {
      alert("No course was updated. Please check administrator update permissions.");
      return;
    }

    alert(id ? "Course updated successfully." : "Course added successfully.");
    resetCourseForm();
    await loadCourses();

  } catch (error) {
    alert("Something went wrong: " + error.message);
  } finally {
    button.disabled = false;
  }
});

checkAdmin();
</script>

</body>
</html>
