
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#54206f">
  <title>BKMI-Sweetbeauty | Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4f9;
      color: #333;
    }

    header {
      background: #54206f;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h2 {
      margin: 0;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 10px 13px;
      cursor: pointer;
      font-weight: bold;
      margin: 3px;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .logout {
      background: white;
      color: #54206f;
    }

    main {
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .welcome,
    .summary,
    .applications {
      background: white;
      padding: 22px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .welcome h1,
    .applications h2 {
      color: #54206f;
    }

    .summary h2 {
      color: #54206f;
      font-size: 34px;
      margin: 5px 0;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 950px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f2eaf6;
      color: #54206f;
    }

    .approve {
      background: #287a45;
      color: white;
    }

    .reject {
      background: #a33b3b;
      color: white;
    }

    .delete {
      background: #333;
      color: white;
    }

    .status {
      font-weight: bold;
      text-transform: capitalize;
    }

    #message {
      color: #54206f;
      margin: 15px 0;
    }

    .refresh {
      background: #54206f;
      color: white;
    }

    @media (max-width: 600px) {
      main {
        padding: 12px;
      }

      .welcome,
      .summary,
      .applications {
        padding: 15px;
      }

      header h2 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h2>BKMI-Sweetbeauty Admin</h2>
    <button class="logout" id="logoutButton">Sign Out</button>
  </header>

  <main>

    <section class="welcome">
      <h1>Welcome, Administrator</h1>
      <p>Manage your school's applications and student administration.</p>
    </section>

    <section class="summary">
      <p>Total Applications Received</p>
      <h2 id="totalApplications">0</h2>
    </section>

    <section class="applications">
      <h2>Student Applications</h2>

      <button class="refresh" id="refreshButton">
        Refresh Applications
      </button>

      <p id="message">Checking administrator access...</p>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Full Name</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Course</th>
              <th>Status</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="applicationRows"></tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    const SUPABASE_URL =
      "https://ahercmxxwwbeobywyudv.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_L0hGKk2ACWTVsTFrsfCvMQ_kK-nHXa1";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    let currentApplications = [];

    async function checkAdmin() {
      const { data, error } =
        await supabaseClient.auth.getUser();

      if (error || !data.user) {
        window.location.href = "admin.html";
        return false;
      }

      const { data: admin, error: adminError } =
        await supabaseClient
          .from("AdminUsers")
          .select("role")
          .eq("user_id", data.user.id)
          .single();

      if (adminError || !admin || admin.role !== "admin") {
        await supabaseClient.auth.signOut();
        window.location.href = "admin.html";
        return false;
      }

      return true;
    }

    async function loadApplications() {
      const message = document.getElementById("message");
      const rows = document.getElementById("applicationRows");

      message.textContent = "Loading applications...";
      rows.innerHTML = "";

      const { data, error } = await supabaseClient
        .from("Applications")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        message.textContent =
          "Could not load applications: " + error.message;
        return;
      }

      currentApplications = data || [];

      document.getElementById("totalApplications").textContent =
        currentApplications.length;

      if (currentApplications.length === 0) {
        message.textContent = "No applications received yet.";
        return;
      }

      message.textContent =
        currentApplications.length + " application(s) loaded.";

      currentApplications.forEach(application => {
        const tr = document.createElement("tr");

        const values = [
          application["Full Name"],
          application["Phone Number"],
          application["Email"],
          application["Course"],
          application["Application Status"],
          application["created_at"]
            ? new Date(application["created_at"]).toLocaleDateString()
            : ""
        ];

        values.forEach((value, index) => {
          const td = document.createElement("td");
          td.textContent = value || "—";

          if (index === 4) {
            td.className = "status";
          }

          tr.appendChild(td);
        });

        const actionCell = document.createElement("td");

        const approveButton = document.createElement("button");
        approveButton.textContent = "Approve";
        approveButton.className = "approve";
        approveButton.addEventListener("click", () => {
          updateApplication(application.id, "approved");
        });

        const rejectButton = document.createElement("button");
        rejectButton.textContent = "Reject";
        rejectButton.className = "reject";
        rejectButton.addEventListener("click", () => {
          updateApplication(application.id, "rejected");
        });

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "delete";
        deleteButton.addEventListener("click", () => {
          deleteApplication(application.id);
        });

        actionCell.append(
          approveButton,
          rejectButton,
          deleteButton
        );

        tr.appendChild(actionCell);
        rows.appendChild(tr);
      });
    }

    async function updateApplication(id, status) {
      const confirmed = window.confirm(
        "Change this application status to " + status + "?"
      );

      if (!confirmed) return;

      const { error } = await supabaseClient
        .from("Applications")
        .update({ "Application Status": status })
        .eq("id", id);

      if (error) {
        alert("Could not update application: " + error.message);
        return;
      }

      alert("Application status updated successfully.");
      await loadApplications();
    }

    async function deleteApplication(id) {
      const confirmed = window.confirm(
        "Are you sure you want to delete this application? This cannot be undone."
      );

      if (!confirmed) return;

      const { error } = await supabaseClient
        .from("Applications")
        .delete()
        .eq("id", id);

      if (error) {
        alert("Could not delete application: " + error.message);
        return;
      }

      alert("Application deleted successfully.");
      await loadApplications();
    }

    document.getElementById("refreshButton")
      .addEventListener("click", loadApplications);

    document.getElementById("logoutButton")
      .addEventListener("click", async () => {
        await supabaseClient.auth.signOut();
        window.location.href = "admin.html";
      });

    async function startDashboard() {
      const authorised = await checkAdmin();

      if (authorised) {
        await loadApplications();
      }
    }

    startDashboard();
  </script>

</body>
</html>
