
<form class="application-form" id="applicationForm">
  <h3>Online Application</h3>

  <label for="fullName">Full name</label>
  <input id="fullName" name="fullName" required placeholder="Your full name">

  <label for="phone">Phone / WhatsApp number</label>
  <input id="phone" name="phone" required type="tel" placeholder="e.g. 080...">

  <label for="email">Email address</label>
  <input id="email" name="email" type="email" placeholder="Your email address">

  <label for="course">Course of interest</label>
  <select id="course" name="course" required>
    <option value="">Select a course</option>
    <option>Hairdressing &amp; Braiding</option>
    <option>Nail Technology</option>
    <option>Makeup Artistry</option>
    <option>Lashes &amp; Brows</option>
    <option>Facials &amp; Aesthetic Therapy</option>
    <option>Spa &amp; Body Treatments</option>
    <option>Barbering &amp; Natural Hair</option>
    <option>Specialist Beauty Skills</option>
    <option>More than one course</option>
  </select>

  <label for="message">Your message (optional)</label>
  <textarea id="message" name="message" rows="3" placeholder="Ask us about fees, duration or the next intake."></textarea>

  <button class="button button-dark" type="submit">Submit application</button>

  <small class="form-note">Our admissions team will contact you after receiving your application.</small>
  <p class="form-error" id="formError" role="status"></p>
</form> 
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
